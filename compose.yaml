# Local environment for development and demos.
#   Database only (develop with hot reload): docker compose up -d db   then   npm run dev
#   Database + app (demo):                   docker compose up --build  then open http://localhost:3000
# Local-only credentials below; never reuse them anywhere else.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: f3
      POSTGRES_PASSWORD: f3_local_password
      POSTGRES_DB: f3_estimation
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f3 -d f3_estimation"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Inside compose the database host is "db", not localhost.
      DATABASE_URL: postgresql://f3:f3_local_password@db:5432/f3_estimation
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Sign-in: the container runs in production mode, so Google sign-in is required and
      # development sign-in is off. Set these in .env (see README). If one is missing, the app's
      # startup check refuses to start and names it (the db service still works on its own).
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_DEV_LOGIN: "0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
