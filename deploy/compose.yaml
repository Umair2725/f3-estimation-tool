# Production on one Linux server: the app plus Caddy for HTTPS. The database is IT's managed
# PostgreSQL 17 (with the vector and pg_trgm extensions), reached through DATABASE_URL.
#
#   Settings:  copy deploy/env.production.example to deploy/.env.production and fill it in
#              (never commit it; .env* files are ignored by git)
#   Start:     docker compose --env-file deploy/.env.production -f deploy/compose.yaml up -d --build
#   Update:    git pull   then the same command again
#   Logs:      docker compose --env-file deploy/.env.production -f deploy/compose.yaml logs -f app
#
# See deploy/README.md for the full steps.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env.production
    environment:
      NODE_ENV: production
      AUTH_DEV_LOGIN: "0"
    restart: unless-stopped
    # Not published: only Caddy reaches the app, over the internal network.
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env.production (for example estimates.folio3.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; keep this volume so they aren't requested again on restart.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
